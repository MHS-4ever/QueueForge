[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "queueforge"
version = "0.1.0"
description = "Serverless S3 event intake through SQS and Lambda"
requires-python = ">=3.12"
dependencies = ["boto3>=1.35,<2"]

[project.scripts]
queueforge = "queueforge.cli:main"

[project.optional-dependencies]
aws-login = ["boto3[crt]>=1.35,<2"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
